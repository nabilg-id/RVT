line-length = 100
target-version = "py310"

[lint]
# E4/E7/E9 + F is ruff's own default correctness set. E501 is deliberately
# not selected: the suite has long, readable assert lines that wrapping would
# only obscure. Add "B" (bugbear) and "I" (isort) for deeper static checks.
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# Test modules use long single-expression fixtures and lambdas; several are
# deliberately wide so the shape of the call stays readable.
"tests/*" = ["E501"]

# The pre-existing clipper tests import lazily: they gate on
# pytest.importorskip for the media stack and then adjust sys.path before
# importing the module under test. That ordering is the whole point, so E402
# is expected rather than a defect.
"clipper/tests/*" = [
    "E402",
    "E701",
    "E741",
    "F841",
]