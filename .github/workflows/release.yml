name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('rch/__init__.py').read()).group(1))")
          SETUP_VERSION=$(python -c "import re;print(re.search(r'version=\"([^\"]+)\"', open('setup.py').read()).group(1))")
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "Tag $TAG != rch/__init__.py $FILE_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$SETUP_VERSION" ]; then
            echo "Tag $TAG != setup.py $SETUP_VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov
          python -m pytest tests/ --cov=rch --cov-report=term-missing --cov-fail-under=100

      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## Ridikc Content Harvester ${{ github.ref_name }}

            Versi Python dari Ridikc Content Harvester.

            ### Perubahan
            - **Runtime:** Python 3.10+ (CLI `rch` via click)
            - **GUI:** Flask di `127.0.0.1`, dibuka di browser lokal
            - **Engine:** `thumbnail`, `channel`, `list`, `info`, `video`,
              `download`, `channel-info`, `channel-video`, `channel-full`,
              `playlist`, `web`
            - **Keamanan:** proteksi formula injection pada ekspor CSV, guard
              cross-origin pada endpoint tulis, confine nama file thumbnail
              agar tidak keluar dari folder output
            - **Uji:** 1248 test, coverage 100%, hijau di Linux/Windows/macOS

            ### Instalasi
            ```
              setup-gui.bat      # Windows
              ./setup-gui.sh     # macOS / Linux
            ```
            Setelah terpasang, jalankan `rch web` untuk membuka GUI.
