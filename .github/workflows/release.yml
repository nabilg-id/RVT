name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('rch/__init__.py').read()).group(1))")
          SETUP_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CLIPPER_VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('clipper/__init__.py').read()).group(1))")
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "Tag $TAG != rch/__init__.py $FILE_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$SETUP_VERSION" ]; then
            echo "Tag $TAG != pyproject.toml $SETUP_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$CLIPPER_VERSION" ]; then
            echo "Tag $TAG != clipper/__init__.py $CLIPPER_VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest --cov --cov-report=term-missing --cov-fail-under=97

      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## Ridikc Video Toolkit ${{ github.ref_name }}

            Dua alat dalam satu proses: pemotong clip viral, dan pengunduh
            channel YouTube.

            ### Isi

            - **Clipper** (`/`): tempel URL di browser, pilih gaya caption,
              generate clip. Pilih momen lewat AI (OpenRouter), transkripsi
              Whisper, face tracking, caption kata-per-kata.
            - **Downloader** (`/download): unduh video, thumbnail, dan metadata
              channel, lengkap dengan `metadata.json` per video dan satu
              `manifest.json` untuk seluruh channel.

            Keduanya satu aplikasi web di `127.0.0.1:8787`, berbagi satu
            registry job — jadi status clip dan status download terbaca dari
            `/api/status/<id>` yang sama.

            ### CLI tetap terpisah
            ```
              rch channel-full <url>   # unduh channel
              rch video <url>          # unduh satu video
              rch web                  # jalankan GUI
              vclip                    # alias GUI
            ```

            ### Yang berubah dari 2.1.1
            - RCH dan Clipper digabung jadi **satu aplikasi**. Modul
              `rch/web` dihapus; halamannya jadi `/download`.
            - **Satu jalur download.** Yunyahan video, batch, dan video tunggal
              kini memakai satu implementasi yt-dlp yang sama.
            - **Metadata JSON.** `metadata.json` per video menggantikan
              `deskripsi.txt` + `link.txt`. `report.json` dan `history.jsonl`
              menggantikan `report.txt` dan `history.log`.
              Berkas lama masih dibaca, jadi arsip run sebelumnya tetap terbaca.
            - Batch punya isolasi error dan checkpoint: satu video mati tidak
              menghentikan channel, dan run yang terputus dilanjutkan bukan
              diulang.

            ### Yang perlu diperhatikan
            - Butuh **Python 3.10+** dan **moviepy 1.x** (`moviepy.editor`
              dihapus di moviepy 2.x).
            - First run mengunduh model Whisper dan dependensi torch yang besar.
            - Butuh **yt-dlp** dan **Node.js** atau runtime JS lain di PATH;
              tanpa itu beberapa video akan gagal diformat.

            ### Uji
            Seluruh test hijau di Linux/Windows/macOS dengan coverage di atas
            ambang 97%. Suite menolak menyentuh jaringan sungguhan, jadi
            menjalankan test tidak pernah contacting YouTube.

            ### Instalasi
            ```
              pip install -r requirements.txt
              python -m clipper.app        # GUI: / dan /download
            ```
