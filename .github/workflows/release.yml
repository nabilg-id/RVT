name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('rch/__init__.py').read()).group(1))")
          SETUP_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CLIPPER_VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('clipper/__init__.py').read()).group(1))")
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "Tag $TAG != rch/__init__.py $FILE_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$SETUP_VERSION" ]; then
            echo "Tag $TAG != pyproject.toml $SETUP_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$CLIPPER_VERSION" ]; then
            echo "Tag $TAG != clipper/__init__.py $CLIPPER_VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest --cov --cov-report=term-missing --cov-fail-under=97

      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## Ridikc Video Toolkit ${{ github.ref_name }}

            Generator clip viral YouTube dengan GUI web lokal.

            ### Isi
            - **Clipper:** tempel URL di browser, pilih gaya caption, generate
              clip. Pilih momen lewat AI (OpenRouter), transkripsi Whisper,
              face tracking, dan caption kata-per-kata.
            - **RCH:** pustaka akuisisi di backend - metadata, thumbnail,
              konfigurasi, dan riwayat.

            ### Yang perlu diperhatikan
            - Butuh **Python 3.10+** dan **moviepy 1.x** (`moviepy.editor`
              dihapus di moviepy 2.x).
            - First run mengunduh model Whisper dan dependensi torch yang besar.

            ### Uji
            Seluruh test hijau di Linux/Windows/macOS dengan coverage di atas
            ambang 97%. Pipeline media (moviepy, Whisper, MediaPipe) diuji
            terpisah terhadap stack penuh - lihat job `test` di workflow `CI`.

            ### Instalasi
            ```
              pip install -r requirements.txt
              python -m clipper.app        # GUI
              python -m clipper.main       # CLI
            ```
