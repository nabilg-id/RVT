name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=rch --cov-report=term-missing --cov-fail-under=100

      - name: Verify legacy backup is untouched by the port
        if: runner.os == 'Linux'
        run: |
          if [ -d legacy-node/test ]; then
            echo "legacy-node/ is read-only reference; confirming no python tests target it"
            ! grep -rl "legacy-node" tests/ | grep .
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Ruff (config pinned in ruff.toml)
        run: ruff check rch/ tests/
